{% extends "base.html" %}
{% block content %}

<div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to check out and track your orders</p>

    <form method="post">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <label for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Your password" required>

        <button type="submit" class="btn full">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>

{% endblock %}
