{% extends "base.html" %}
{% block content %}

<h1 class="page-title">{% if editing %}Edit product{% else %}Add a new product{% endif %}</h1>

<form class="checkout-form narrow" method="post">
    <label for="name">Product name</label>
    <input id="name" type="text" name="name" value="{{ product['name'] or '' }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ product['description'] or '' }}</textarea>

    <div class="two-col">
        <div>
            <label for="price">Price (₹)</label>
            <input id="price" type="number" step="0.01" min="0" name="price" value="{{ product['price'] if product['price'] is not none else '' }}" required>
        </div>
        <div>
            <label for="stock">Stock quantity</label>
            <input id="stock" type="number" min="0" name="stock" value="{{ product['stock'] if product['stock'] is not none else '' }}">
        </div>
    </div>

    <label for="category">Category</label>
    <input id="category" type="text" name="category" value="{{ product['category'] or '' }}" placeholder="e.g. Electronics">

    <label for="image_url">Image URL</label>
    <input id="image_url" type="url" name="image_url" value="{{ product['image_url'] or '' }}" placeholder="Leave blank for a placeholder image">

    <div class="form-buttons">
        <button type="submit" class="btn">Save product</button>
        <a href="{{ url_for('admin_products') }}" class="btn light">Cancel</a>
    </div>
</form>

{% endblock %}
